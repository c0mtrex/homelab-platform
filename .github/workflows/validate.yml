name: Validate platform configuration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Platform configuration and API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate platform configuration
        run: scripts/validate.sh

      - name: Test service-health API
        run: scripts/test-service-health-api.sh
