name: Publish service health API image

on:
  push:
    branches:
      - main
    paths:
      - docker/service-health-api/**
      - .github/workflows/publish-service-health-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-service-health-api-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/service-health-api

jobs:
  publish:
    name: Build and publish immutable image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./docker/service-health-api
          file: ./docker/service-health-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write publication summary
        run: |
          {
            echo "### Service Health API image published"
            echo "- Image: $REGISTRY/$IMAGE_NAME:${{ github.sha }}"
            echo "- Digest: ${{ steps.publish.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
