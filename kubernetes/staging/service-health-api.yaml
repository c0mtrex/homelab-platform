apiVersion: v1
kind: Namespace
metadata:
  name: staging

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-health-api
  namespace: staging
  labels:
    app: service-health-api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: service-health-api
  template:
    metadata:
      labels:
        app: service-health-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-health-api
          image: ghcr.io/c0mtrex/service-health-api@sha256:9fb3a2270cd2fce1b7ef8be82ec3e4ec60f1092382ebe11877887352e53a482f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: SERVICE_NAME
              value: service-health-api
            - name: DEPENDENCY_URL
              value: http://10.0.0.30:9090/-/healthy
            - name: REQUEST_TIMEOUT_SECONDS
              value: "3"
            - name: ALLOWED_ORIGINS
              value: http://10.10.0.160:3000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: service-health-api
  namespace: staging
  labels:
    app: service-health-api
spec:
  type: ClusterIP
  selector:
    app: service-health-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-health-api
  namespace: staging
  labels:
    app: service-health-api
spec:
  ingressClassName: traefik
  rules:
    - host: service-health-api.staging.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-health-api
                port:
                  name: http
