global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: docker01
    static_configs:
      - targets:
          - 10.0.0.30:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - 10.0.0.30:8080

  - job_name: service-health-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.10.0.130:8082
        labels:
          environment: lab
          host: k801
