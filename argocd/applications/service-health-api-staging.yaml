apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: service-health-api-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/c0mtrex/homelab-platform.git
    targetRevision: main
    path: kubernetes/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
